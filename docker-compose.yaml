version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: mysql_container
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: almy
      MYSQL_USER: my_user
      MYSQL_PASSWORD: userpassword
    volumes:
      - ./almy:/var/lib/mysql # Pour stocker les données de manière persistante
    ports:
      - "3310:3306" # Pour accéder à MySQL depuis l'extérieur du conteneur
    networks:
      - my_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_container
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "8080:80" # Accès à phpMyAdmin via le port 8080
    depends_on:
      - db
    networks:
      - my_network

networks:
  my_network:
    driver: bridge